services:
  - type: web
    name: edushare-academic-portal
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn edushare_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: edushare-db
          property: connectionString

databases:
  - name: edushare-db
    databaseName: edushare
    user: edushare_user
    plan: free
